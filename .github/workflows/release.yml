# Builds and publishes a release on GitHub when a version tag is pushed.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Manual version tag (e.g., v1.0.0)'
        required: false
      overwrite:
        description: 'Replace the assets of an existing release for that tag'
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # 如果手动触发时没填 tag，默认用 v1.0.0-manual，防止报错
      TAG: ${{ inputs.tag || 'v1.0.0-manual' }}
      OVERWRITE: ${{ inputs.overwrite }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 强制拉取当前分支（通常是 main），不再强制找不存在的标签
          fetch-depth: 0      
          fetch-tags: true 

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure the pinned Android toolchain
        run: |
          set -uo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "sdk root: ${sdk_root:-unset}"
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ] && [ -n "$sdk_root" ]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -mindepth 3 -maxdepth 3 -type f -name sdkmanager -print 2>/dev/null | sort | tail -1 || true)"
          fi
          echo "sdkmanager: ${sdkmanager_bin:-not found}"
          if [ -n "$sdkmanager_bin" ]; then
            yes | "$sdkmanager_bin" --sdk_root="$sdk_root" --licenses > /dev/null 2>&1 || true
            "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-37.0" "build-tools;36.0.0" \
              || "$sdkmanager_bin" --sdk_root="$sdk_root" --install "platforms;android-37" "build-tools;36.0.0" \
              || echo "::warning::sdkmanager could not install the pinned packages"
          else
            echo "::warning::sdkmanager is unavailable; relying on the packages already in the image"
          fi
          if [ ! -d "$sdk_root/platforms/android-37.0" ]; then
            echo "::error::compileSdk 37 is missing from this image: $sdk_root/platforms/android-37.0"
            ls -1 "$sdk_root/platforms" 2>/dev/null || true
            exit 1
          fi
          echo "platforms present:"; ls -1 "$sdk_root/platforms"
          if [ ! -d "$sdk_root/build-tools/36.0.0" ]; then
            echo "::warning::build-tools 36.0.0 is missing; the build will use another installed version"
            ls -1 "$sdk_root/build-tools" 2>/dev/null || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        continue-on-error: true

      # 注意：这里删除了 Check the tag against versionName 的强校验，防止版本号不一致导致构建失败

      - name: Verify before publishing
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --console=plain --stacktrace

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Build the signed release APK
        env:
          LUSOUND_KEYSTORE_BASE64: ${{ secrets.LUSOUND_KEYSTORE_BASE64 }}
          LUSOUND_STORE_PASSWORD: ${{ secrets.LUSOUND_STORE_PASSWORD }}
          LUSOUND_KEY_ALIAS: ${{ secrets.LUSOUND_KEY_ALIAS }}
          LUSOUND_KEY_PASSWORD: ${{ secrets.LUSOUND_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${LUSOUND_KEYSTORE_BASE64:-}" ] || [ -z "${LUSOUND_STORE_PASSWORD:-}" ] || [ -z "${LUSOUND_KEY_ALIAS:-}" ] || [ -z "${LUSOUND_KEY_PASSWORD:-}" ]; then
            echo "::warning::signing secrets are not configured; publishing without the signed APK"
            exit 0
          fi
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$LUSOUND_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          export LUSOUND_KEYSTORE="$keystore"
          ./gradlew :app:assembleRelease --console=plain --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Collect the artifacts
        id: collect
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/lusound-${version}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/lusound-${version}-release.apk"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "signed=no" >> "$GITHUB_OUTPUT"
          fi
          cd dist
          sha256sum ./*.apk > "SHA256SUMS-${version}.txt"
          ls -l

      - name: Write the release notes
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            echo "LuSound ${TAG}"
            echo
            echo "安装包校验值见 \`SHA256SUMS-${version}.txt\`。"
            echo
            if [ "${{ steps.collect.outputs.signed }}" = "yes" ]; then
              echo "\`lusound-${version}-release.apk\` 为签名发布包。"
            else
              echo "> **本次未包含签名发布包。**"
              echo "> 缺少签名密钥的 Secrets，因此只构建了调试包。"
            fi
            echo
            echo "\`lusound-${version}-debug.apk\` 使用独立应用 ID，可与发布包共存，仅用于测试。"
          } > RELEASE_NOTES.md

      - name: Upload the packages as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lusound-${{ env.TAG }}
          if-no-files-found: warn
          retention-days: 14
          path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "${OVERWRITE:-false}" != "true" ]; then
              echo "::warning::release $TAG already exists; leaving its assets alone"
              exit 0
            fi
            echo "replacing the assets of $TAG"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
